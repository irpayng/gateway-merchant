name: CI/CD Pipeline

on:
  push:
    branches: [staging, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================
  # LINT (code formatting check)
  # ============================================
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Seed the Eclipse formatter
        # Keeps the formatting check off download.eclipse.org; see .github/spotless/README.md.
        run: |
          mkdir -p ~/.m2/repository/dev/equo
          tar xzf .github/spotless/eclipse-4.33-p2.tgz -C ~/.m2/repository/dev/equo

      - name: Check code formatting
        run: mvn spotless:check -B

  # ============================================
  # BUILD & TEST
  # ============================================
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Clone and install shared libraries
        run: |
          git clone https://x-access-token:${{ secrets.GH_PACKAGES_TOKEN }}@github.com/irpayng/tms-core-utils.git /tmp/core-utils
          mvn -f /tmp/core-utils/pom.xml install -q -B

      - name: Build and test
        run: mvn package -B

  # ============================================
  # PUSH STAGING IMAGE (every push to staging)
  # ============================================
  push-staging:
    needs: [lint, test]
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push staging image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            CACHE_BUST=${{ github.sha }}
          tags: |
            irpaytech/gateway-merchant:staging
            irpaytech/gateway-merchant:staging-${{ github.sha }}
          secrets: |
            GH_PAT=${{ secrets.GH_PACKAGES_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # PUSH PRODUCTION IMAGE (every push to main)
  # ============================================
  push-production:
    needs: [lint, test]
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push production image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            CACHE_BUST=${{ github.sha }}
          tags: |
            irpaytech/gateway-merchant:production
            irpaytech/gateway-merchant:latest
          secrets: |
            GH_PAT=${{ secrets.GH_PACKAGES_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
