# Test configuration
spring.application.name=gateway-merchant-test

# H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Flyway for tests (use JPA auto-create)
spring.flyway.enabled=false

# Kafka - disable for unit tests
spring.kafka.bootstrap-servers=localhost:9092
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# JWT
app.jwt.secret=test-secret-key-for-unit-tests-must-be-long-enough
app.jwt.expiration-ms=3600000

# gRPC (mocked in tests)
grpc.services.user.host=localhost
grpc.services.user.port=9090
grpc.services.kyc.host=localhost
grpc.services.kyc.port=9091
