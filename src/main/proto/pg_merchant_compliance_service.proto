syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.tms.gateway.modules.grpc.compliance";

package pgmerchant;

// Merchant compliance source of truth. Interactive reads and writes use the
// merchant-scoped RPCs; Kafka maintains replicas for eventual read use cases.
service PgMerchantComplianceService {

  // Merchant-scoped v2 operations MUST validate membership, versions and idempotency upstream.
  // Separate RPC names fail closed against legacy servers that cannot enforce this contract.
  rpc StartMerchantCompliance (MerchantComplianceRequest) returns (ComplianceResponse);
  rpc GetMerchantCompliance (MerchantComplianceRequest) returns (ComplianceResponse);
  rpc SaveMerchantProfileDraft (MerchantProfileDraftRequest) returns (ComplianceResponse);
  rpc SaveMerchantContactDraft (MerchantContactDraftRequest) returns (ComplianceResponse);
  rpc SaveMerchantOwnersDraft (MerchantOwnersDraftRequest) returns (ComplianceResponse);
  rpc SaveMerchantBankAccountsDraft (MerchantBankAccountsDraftRequest) returns (ComplianceResponse);
  rpc SaveMerchantRegistrationDraft (MerchantRegistrationDraftRequest) returns (ComplianceResponse);
  rpc AcceptAgreementAndSubmit (MerchantSubmissionRequest) returns (ComplianceResponse);
  rpc ListComplianceReferenceData (ReferenceDataRequest) returns (ReferenceDataResponse);
  rpc CreateComplianceDocumentUpload (DocumentUploadRequest) returns (DocumentUploadResponse);
  rpc CompleteComplianceDocumentUpload (DocumentRequest) returns (DocumentResponse);
  rpc GetComplianceDocument (DocumentRequest) returns (DocumentResponse);
  rpc DeleteComplianceDocument (DocumentRequest) returns (DocumentResponse);

  // Legacy user-scoped RPCs retained for wire compatibility. The gateway no
  // longer calls these operations because they cannot enforce the v2 contract.
  // Start a new compliance application (idempotent)
  rpc StartCompliance (StartComplianceRequest) returns (ComplianceResponse);
  
  // Get current compliance status (for initial sync, not for reads)
  rpc GetCompliance (GetComplianceRequest) returns (ComplianceResponse);
  
  // Save step 1: Profile details
  rpc SaveProfile (SaveProfileRequest) returns (ComplianceResponse);
  
  // Save step 2: Contact information
  rpc SaveContact (SaveContactRequest) returns (ComplianceResponse);
  
  // Save step 3: Owners/directors
  rpc SaveOwners (SaveOwnersRequest) returns (ComplianceResponse);
  
  // Save step 4: Bank accounts
  rpc SaveBankAccounts (SaveBankAccountsRequest) returns (ComplianceResponse);
  
  // Save step 5: Service agreement
  rpc SaveAgreement (SaveAgreementRequest) returns (ComplianceResponse);
  
  // Submit compliance for review
  rpc SubmitCompliance (SubmitComplianceRequest) returns (ComplianceResponse);
}

// ── Request Messages ────────────────────────────────────────

message StartComplianceRequest {
  int64 user_id = 1;
  string merchant_id = 2;
}

message GetComplianceRequest {
  int64 user_id = 1;
}

message SaveProfileRequest {
  int64 user_id = 1;
  string country = 2;
  string industry = 3;
  string category = 4;
  string trading_name = 5;
  string sales_volume = 6;
  string business_type = 7;
  string business_name = 8;
  string rc_number = 9;
  string cac_url = 10;
  string business_description = 11;
  string currency = 12;
}

message SaveContactRequest {
  int64 user_id = 1;
  string email = 2;
  string phone = 3;
  string address = 4;
  string city = 5;
  string state = 6;
  string postal_code = 7;
  string country = 8;
  string support_email = 9;
  string dispute_email = 10;
  string lga = 11;
  bool same_as_support_email = 12;
  string business_address_document_id = 13;
  repeated OnlineLinkData online_links = 14;
}

message SaveOwnersRequest {
  int64 user_id = 1;
  repeated OwnerData owners = 2;
}

message OwnerData {
  int64 id = 1;
  string role = 2;
  string first_name = 3;
  string last_name = 4;
  string email = 5;
  string phone = 6;
  string bvn = 7;
  string nin = 8;
  string date_of_birth = 9;
  string address = 10;
  int32 ownership_percentage = 11;
  string id_document_url = 12;
  string id_document_type = 13;
  string full_name = 14;
  string nationality = 15;
  string state = 16;
  string lga = 17;
  bool same_as_business_address = 18;
  string id_document_id = 19;
  string proof_of_address_document_id = 20;
}

message SaveBankAccountsRequest {
  int64 user_id = 1;
  repeated BankAccountData bank_accounts = 2;
}

message BankAccountData {
  int64 id = 1;
  string bank_code = 2;
  string bank_name = 3;
  string account_number = 4;
  string account_name = 5;
  bool is_primary = 6;
  string currency = 7;
}

message SaveAgreementRequest {
  int64 user_id = 1;
  bool terms_accepted = 2;
  string terms_version = 3;
  bool privacy_accepted = 4;
  string ip_address = 5;
  string user_agent = 6;
}

message SubmitComplianceRequest {
  int64 user_id = 1;
}

// ── Response Messages ───────────────────────────────────────

message ComplianceResponse {
  bool success = 1;
  string message = 2;
  ComplianceData compliance = 3;
  string error_code = 4;
  repeated CorrectionData errors = 5;
}

message ComplianceData {
  int64 compliance_id = 1;
  int64 user_id = 2;
  string merchant_id = 3;
  string status = 4;
  int32 current_step = 5;
  bool profile_complete = 6;
  bool contact_complete = 7;
  bool owners_complete = 8;
  bool bank_accounts_complete = 9;
  bool agreement_complete = 10;
  string rejection_reason = 11;
  string reviewed_by = 12;
  string reviewed_at = 13;
  string created_at = 14;
  string updated_at = 15;
  
  // Full step data (included in GetCompliance)
  ProfileData profile = 16;
  ContactData contact = 17;
  repeated OwnerData owners = 18;
  repeated BankAccountData bank_accounts = 19;
  AgreementData agreement = 20;
  int64 version = 21;
  repeated CorrectionData corrections = 22;
  RegistrationData registration = 23;
  bool registration_complete = 24;
  int64 updated_by = 25;
}

message ProfileData {
  string country = 1;
  string industry = 2;
  string category = 3;
  string trading_name = 4;
  string sales_volume = 5;
  string business_type = 6;
  string business_name = 7;
  string rc_number = 8;
  string cac_url = 9;
  string business_description = 10;
  string currency = 11;
}

message ContactData {
  string email = 1;
  string phone = 2;
  string address = 3;
  string city = 4;
  string state = 5;
  string postal_code = 6;
  string country = 7;
  string support_email = 8;
  string dispute_email = 9;
  string lga = 10;
  bool same_as_support_email = 11;
  string business_address_document_id = 12;
  repeated OnlineLinkData online_links = 13;
}

message AgreementData {
  bool terms_accepted = 1;
  string terms_version = 2;
  bool privacy_accepted = 3;
  string ip_address = 4;
  string user_agent = 5;
  string accepted_at = 6;
}

// v2 mutation contract: check replay first, then expected_version, then write in ONE transaction.
// Partial scalars merge only fields listed in supplied_fields. Collections replace atomically.
message MutationContext {
  int64 actor_user_id = 1;
  string merchant_id = 2;
  string idempotency_key = 3;
  int64 expected_version = 4;
}
message MerchantComplianceRequest { MutationContext context = 1; }
message MerchantProfileDraftRequest { MutationContext context = 1; SaveProfileRequest data = 2; repeated string supplied_fields = 3; }
message MerchantContactDraftRequest { MutationContext context = 1; SaveContactRequest data = 2; repeated string supplied_fields = 3; }
message MerchantOwnersDraftRequest { MutationContext context = 1; repeated OwnerData owners = 2; repeated FieldPresence owner_fields = 3; }
message FieldPresence { repeated string fields = 1; }
message MerchantBankAccountsDraftRequest { MutationContext context = 1; repeated BankAccountData bank_accounts = 2; repeated FieldPresence account_fields = 3; }
message MerchantRegistrationDraftRequest { MutationContext context = 1; RegistrationData data = 2; repeated string supplied_fields = 3; }
message MerchantSubmissionRequest {
  MutationContext context = 1;
  bool agreement_accepted = 2;
  string ip_address = 3;
  string user_agent = 4;
}
message RegistrationData { string registration_number = 1; string tax_identification_number = 2; }
message OnlineLinkData { string platform = 1; string url = 2; }
message CorrectionData { string step = 1; string field = 2; string message = 3; }
message ReferenceDataRequest {
  string kind = 1; string parent_code = 2; string country = 3; string currency = 4;
}
message ReferenceOption { string code = 1; string label = 2; string parent_code = 3; string currency = 4; string minimum = 5; string maximum = 6; }
message ReferenceDataResponse { repeated ReferenceOption options = 1; }
// KYC owns private object storage, scan lifecycle, merchant authorization and document retention.
message DocumentUploadRequest {
  MutationContext context = 1; string purpose = 2; string file_name = 3;
  string content_type = 4; int64 size_bytes = 5;
}
message DocumentUploadResponse {
  string document_id = 1; string upload_url = 2; string expires_at = 3;
  map<string,string> headers = 4; string method = 5;
}
message DocumentRequest { MutationContext context = 1; string document_id = 2; }
message DocumentResponse {
  string document_id = 1; string status = 2; string download_url = 3; string expires_at = 4;
}
