# Application
spring.application.name=${APP_NAME:gateway-merchant}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.consumer.group-id=gateway-merchant
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# SASL/SCRAM authentication (set via env vars in staging/prod, empty locally)
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:}
spring.kafka.properties.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG:}

# Datasource - SEPARATE database for gateway-merchant (scalability)
spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_DATABASE:gateway_merchant}?prepareThreshold=0
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=20

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Flyway database migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Jackson
spring.jackson.property-naming-strategy=SNAKE_CASE

# Server
server.port=${APP_PORT:8090}

# Interactive API documentation; set SWAGGER_ENABLED=false to disable both routes.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# App
app.timezone=Africa/Lagos
app.jwt.secret=${JWT_SECRET:RVBnYqNvKOGrSRFAmloJz4wh8Hw4OVFG6PUsd87bM8x9y2z3}
app.jwt.expiration-ms=86400000

# gRPC configuration
grpc.timeout=${GRPC_TIMEOUT:30}
grpc.logging=${GRPC_LOGGING:true}

# Internal API key for service-to-service auth
grpc.api.key=${GRPC_API_KEY:secret}

# gRPC service endpoints
grpc.services.user.host=${USER_SERVICE_GRPC_HOST:localhost}
grpc.services.user.port=${USER_SERVICE_GRPC_PORT:8081}
grpc.services.kyc.host=${KYC_SERVICE_GRPC_HOST:localhost}
grpc.services.kyc.port=${KYC_SERVICE_GRPC_PORT:8085}
grpc.services.transaction.host=${TRANSACTION_SERVICE_GRPC_HOST:localhost}
grpc.services.transaction.port=${TRANSACTION_SERVICE_GRPC_PORT:8084}
grpc.services.notification.host=${NOTIFICATION_SERVICE_GRPC_HOST:localhost}
grpc.services.notification.port=${NOTIFICATION_SERVICE_GRPC_PORT:8087}

# Actuator + Prometheus metrics
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=gateway-merchant

# Logging
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
